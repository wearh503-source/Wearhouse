<!DOCTYPE html>
<html lang="en" data-theme="neon">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Wearhouse — Order Status</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- GSAP 3.12.5 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <!-- Firebase SDK ESM Import Map -->
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"
      }
    }
  </script>

  <link rel="stylesheet" href="/store.css">
  <script src="/cart.js" defer></script>

  <style>
    .order-status-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      border-radius: var(--card-radius-sm);
      padding: clamp(24px, 5vw, 48px);
      max-width: 720px;
      margin: 32px auto 0;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .status-badge-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .status-pill--created {
      background: rgba(255, 215, 0, 0.15);
      border: 1px solid #ffd700;
      color: #ffe66d;
    }

    .status-pill--paid {
      background: rgba(229, 250, 171, 0.2);
      border: 1px solid var(--color-cami-green);
      color: var(--color-cami-green);
    }

    .status-pill--shipped {
      background: rgba(100, 200, 255, 0.2);
      border: 1px solid #64c8ff;
      color: #64c8ff;
    }

    .status-pill--delivered {
      background: rgba(100, 255, 150, 0.2);
      border: 1px solid #64ff96;
      color: #64ff96;
    }

    .status-pill--failed {
      background: rgba(255, 100, 100, 0.2);
      border: 1px solid #ff6464;
      color: #ff9aa2;
    }

    .order-items-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    .order-items-table th, .order-items-table td {
      padding: 12px 8px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 14px;
    }

    .order-items-table th {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      opacity: 0.6;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="store-header">
    <div class="store-brand">
      <a href="/" class="store-brand-title">WEARHOUSE</a>
    </div>
    <div class="store-nav-links">
      <a href="/core" class="nav-link">Shop Core line</a>
    </div>
  </header>

  <main class="store-container">
    <header class="page-title-mask" style="text-align: center; width: 100%;">
      <h1 class="page-title" style="text-align: center;">ORDER STATUS</h1>
    </header>

    <div class="order-status-card" id="order-card">
      <div class="status-badge-row">
        <div>
          <span style="font-size: 13px; opacity: 0.7; text-transform: uppercase;">Order ID</span>
          <h2 style="font-family: var(--font-display); font-size: 22px; letter-spacing: -0.02em;" id="order-id-display">Loading...</h2>
        </div>
        <div id="status-pill-container">
          <span class="status-pill status-pill--created">
            <span class="spinner"></span>
            <span>Awaiting Webhook Confirmation</span>
          </span>
        </div>
      </div>

      <div id="status-message" style="font-size: 16px; line-height: 1.5; color: rgba(253,252,248,0.9);">
        Connecting to Wearhouse live order stream...
      </div>

      <!-- Items Section -->
      <div>
        <h3 style="font-size: 16px; font-weight: 800; border-bottom: 1px solid var(--border-subtle); padding-bottom: 8px;">Order Details</h3>
        <table class="order-items-table">
          <thead>
            <tr>
              <th>Item</th>
              <th>Size</th>
              <th>Qty</th>
              <th style="text-align: right;">Price</th>
            </tr>
          </thead>
          <tbody id="items-tbody">
            <tr><td colspan="4" style="text-align: center; opacity: 0.6;">Loading items...</td></tr>
          </tbody>
          <tfoot>
            <tr>
              <td colspan="3" style="font-weight: 800; padding-top: 16px;">Total Paid</td>
              <td style="font-weight: 800; text-align: right; color: var(--color-cami-green); font-size: 18px; padding-top: 16px;" id="order-total-display">₹0</td>
            </tr>
          </tfoot>
        </table>
      </div>

      <!-- Delivery Section -->
      <div id="delivery-info-section" style="border-top: 1px solid var(--border-subtle); padding-top: 16px; font-size: 14px; line-height: 1.6;">
        <h3 style="font-size: 16px; font-weight: 800; margin-bottom: 8px;">Shipping Address</h3>
        <div id="customer-address-display" style="opacity: 0.85;">Loading delivery details...</div>
      </div>

      <div style="display: flex; gap: 16px; margin-top: 8px;">
        <a href="/core" style="background: var(--color-cami-green); color: var(--color-bag-maroon); font-weight: 800; padding: 12px 24px; border-radius: 12px; text-decoration: none; font-size: 15px;">
          Continue Shopping &rarr;
        </a>
      </div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "firebase/app";
    import { getFirestore, doc, onSnapshot } from "firebase/firestore";

    const firebaseConfig = {
      projectId: "wear-house-6d810",
      appId: "1:52294491181:web:2fa3b1d59694a5540b2ca4",
      storageBucket: "wear-house-6d810.firebasestorage.app",
      apiKey: "AIzaSyDaCBap5iVKrF6APAZy81m2X1IieTgB-cM",
      authDomain: "wear-house-6d810.firebaseapp.com",
      messagingSenderId: "52294491181"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get("id");
    const readToken = urlParams.get("token");

    const orderIdDisplay = document.getElementById("order-id-display");
    const statusPillContainer = document.getElementById("status-pill-container");
    const statusMsg = document.getElementById("status-message");
    const itemsTbody = document.getElementById("items-tbody");
    const totalDisplay = document.getElementById("order-total-display");
    const addressDisplay = document.getElementById("customer-address-display");

    if (!orderId) {
      orderIdDisplay.textContent = "Order Not Found";
      statusMsg.textContent = "No valid Order ID was specified in the URL. Please return to the shop.";
      statusPillContainer.innerHTML = `<span class="status-pill status-pill--failed">Missing ID</span>`;
    } else {
      orderIdDisplay.textContent = orderId;

      // Realtime listener: onSnapshot on orders/{id}
      // Status becomes 'paid' only when set by the Razorpay webhook on the server
      const orderRef = doc(db, "orders", orderId);
      
      onSnapshot(orderRef, (docSnap) => {
        if (!docSnap.exists()) {
          statusMsg.textContent = "Order record is synchronizing. Please hold on...";
          return;
        }

        const order = docSnap.data();
        updateUI(order);
      }, (err) => {
        console.warn("Realtime order stream notice:", err.message);
      });
    }

    function updateUI(order) {
      const status = order.status || "created";

      // Status Pill & Message
      if (status === "paid") {
        statusPillContainer.innerHTML = `<span class="status-pill status-pill--paid">✓ Payment Verified & Paid</span>`;
        statusMsg.innerHTML = `<strong>Order Confirmed!</strong> Razorpay payment has been verified. Confirmation email sent to <strong>${order.customer?.email || 'your email'}</strong>.`;
      } else if (status === "shipped") {
        statusPillContainer.innerHTML = `<span class="status-pill status-pill--shipped">🚚 Dispatched & Shipped</span>`;
        statusMsg.innerHTML = `Your order has been packed and handed over to our delivery partner.`;
      } else if (status === "delivered") {
        statusPillContainer.innerHTML = `<span class="status-pill status-pill--delivered">🎉 Delivered</span>`;
        statusMsg.innerHTML = `This order has been delivered. Thank you for wearing Wearhouse!`;
      } else if (status === "failed") {
        statusPillContainer.innerHTML = `<span class="status-pill status-pill--failed">Payment Failed</span>`;
        statusMsg.innerHTML = `Your payment could not be processed. <a href="/checkout" style="color: var(--color-cami-green); text-decoration: underline;">Return to checkout</a> to retry.`;
      } else {
        statusPillContainer.innerHTML = `
          <span class="status-pill status-pill--created">
            <span class="spinner"></span>
            <span>Verifying with Bank...</span>
          </span>
        `;
        statusMsg.innerHTML = `Razorpay transaction initiated. Awaiting webhook capture confirmation from your bank.`;
      }

      // Items table
      if (Array.isArray(order.items)) {
        itemsTbody.innerHTML = order.items.map(item => `
          <tr>
            <td><strong>${item.name}</strong></td>
            <td>${item.size}</td>
            <td>${item.qty}</td>
            <td style="text-align: right;">₹${((item.price_paise * item.qty) / 100).toLocaleString("en-IN")}</td>
          </tr>
        `).join("");
      }

      // Total
      if (order.total_paise) {
        totalDisplay.textContent = `₹${(order.total_paise / 100).toLocaleString("en-IN")}`;
      }

      // Customer Address
      if (order.customer) {
        addressDisplay.innerHTML = `
          <strong>${order.customer.name}</strong> (${order.customer.phone})<br>
          ${order.customer.address}<br>
          ${order.customer.city}, ${order.customer.state} - ${order.customer.pincode}
        `;
      }
    }
  </script>
</body>
</html>
