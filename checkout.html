<!DOCTYPE html>
<html lang="en" data-theme="beige">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Wearhouse — Secure Checkout</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- GSAP 3.12.5 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <!-- Razorpay Standard Checkout SDK -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <!-- Firebase SDK ESM Import Map -->
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js"
      }
    }
  </script>

  <link rel="stylesheet" href="/store.css">
  <script src="/cart.js"></script>

  <style>
    .checkout-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: clamp(24px, 4vw, 48px);
      margin-top: 32px;
      align-items: start;
    }

    @media (max-width: 820px) {
      .checkout-grid {
        grid-template-columns: 1fr;
      }
    }

    .form-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      border-radius: var(--card-radius-sm);
      padding: clamp(20px, 4vw, 36px);
    }

    .section-heading {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 24px;
      margin-bottom: 20px;
      letter-spacing: -0.02em;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    @media (max-width: 520px) {
      .form-row {
        grid-template-columns: 1fr;
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .form-label {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: rgba(253, 252, 248, 0.8);
    }

    .form-input {
      height: 50px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 0 16px;
      color: var(--color-cream);
      font-family: var(--font-body);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }

    .form-input:focus {
      border-color: var(--color-cami-green);
      background: rgba(255, 255, 255, 0.12);
    }

    .order-summary-card {
      background: rgba(85, 10, 36, 0.8);
      border: 1px solid var(--border-subtle);
      border-radius: var(--card-radius-sm);
      padding: clamp(20px, 4vw, 32px);
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: sticky;
      top: 100px;
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 14px;
    }

    .summary-total-row {
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      font-weight: 800;
      padding-top: 8px;
    }

    .pay-btn {
      width: 100%;
      height: 60px;
      border-radius: 16px;
      background-color: var(--color-cami-green);
      color: var(--color-bag-maroon);
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 19px;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.2s, background-color 0.2s;
    }

    .pay-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      background-color: #fff;
    }

    .pay-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .error-banner {
      background: rgba(255, 75, 75, 0.15);
      border: 1px solid #ff4b4b;
      color: #ff9aa2;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="store-header">
    <div class="store-brand">
      <a href="/" class="store-brand-title">WEARHOUSE</a>
    </div>
    <div class="store-nav-links">
      <a href="/core" class="nav-link">Back to Store</a>
    </div>
  </header>

  <main class="store-container">
    <header class="page-title-mask">
      <h1 class="page-title">CHECKOUT</h1>
    </header>

    <div class="error-banner" id="error-banner"></div>

    <div class="checkout-grid">
      <!-- Customer Delivery Form -->
      <form class="form-card" id="checkout-form">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
          <h2 class="section-heading" style="margin-bottom: 0;">Delivery Details</h2>
          <span id="google-user-status" style="font-size: 12px; color: var(--color-cami-green); font-weight: 600;"></span>
        </div>

        <!-- Google Express Autofill Button -->
        <button type="button" id="google-autofill-btn" style="width: 100%; height: 46px; border-radius: 12px; background: #ffffff; color: #1f1f1f; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; border: 1px solid rgba(0,0,0,0.08); box-shadow: 0 3px 10px rgba(0,0,0,0.12); margin-bottom: 20px; transition: transform 0.2s, background-color 0.2s;">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span id="google-autofill-btn-text">Autofill with Google</span>
        </button>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="cust-name">Full Name *</label>
            <input type="text" id="cust-name" class="form-input" placeholder="e.g. Rahul Sharma" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="cust-phone">Phone Number * (10 Digits)</label>
            <input type="tel" id="cust-phone" class="form-input" placeholder="9876543210" pattern="[0-9]{10}" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="cust-email">Email Address * (For Receipt & Tracking)</label>
          <input type="email" id="cust-email" class="form-input" placeholder="rahul@example.com" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="cust-address">Street Address *</label>
          <input type="text" id="cust-address" class="form-input" placeholder="Flat / House No., Building, Street" required />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="cust-city">City *</label>
            <input type="text" id="cust-city" class="form-input" placeholder="e.g. Mumbai" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="cust-state">State *</label>
            <input type="text" id="cust-state" class="form-input" placeholder="e.g. Maharashtra" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="cust-pincode">PIN Code * (6 Digits)</label>
          <input type="text" id="cust-pincode" class="form-input" placeholder="400001" pattern="[0-9]{6}" maxlength="6" required />
        </div>

        <div style="font-size: 13px; color: rgba(253,252,248,0.6); margin-top: 8px;">
          🔒 Online payment only via Razorpay (UPI, Credit/Debit Cards, Netbanking). No Cash on Delivery.
        </div>
      </form>

      <!-- Order Summary Column -->
      <aside class="order-summary-card">
        <h2 class="section-heading" style="margin-bottom: 0;">Order Summary</h2>
        <div id="summary-items-list" style="display: flex; flex-direction: column; gap: 8px;"></div>

        <div style="border-top: 1px solid var(--border-subtle); padding-top: 12px; display: flex; flex-direction: column; gap: 8px;">
          <div style="display: flex; justify-content: space-between; font-size: 14px; opacity: 0.8;">
            <span>Shipping across India</span>
            <span style="color: var(--color-cami-green); font-weight: bold;">FREE</span>
          </div>
          <div class="summary-total-row">
            <span>Total Payable</span>
            <span id="summary-total" style="color: var(--color-cami-green);">₹0</span>
          </div>
        </div>

        <button type="submit" form="checkout-form" class="pay-btn" id="pay-now-btn">
          <span>Pay with Razorpay &rarr;</span>
        </button>
      </aside>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "firebase/app";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "firebase/auth";

    const firebaseConfig = {
      projectId: "wear-house-6d810",
      appId: "1:52294491181:web:2fa3b1d59694a5540b2ca4",
      storageBucket: "wear-house-6d810.firebasestorage.app",
      apiKey: "AIzaSyDaCBap5iVKrF6APAZy81m2X1IieTgB-cM",
      authDomain: "wear-house-6d810.firebaseapp.com",
      messagingSenderId: "52294491181"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();

    document.addEventListener("DOMContentLoaded", () => {
      const autofillBtn = document.getElementById("google-autofill-btn");
      const userStatusEl = document.getElementById("google-user-status");
      const nameInput = document.getElementById("cust-name");
      const emailInput = document.getElementById("cust-email");

      function populateFromUser(user) {
        if (!user) return;
        if (user.displayName && (!nameInput.value || nameInput.value === "")) {
          nameInput.value = user.displayName;
        }
        if (user.email) {
          emailInput.value = user.email;
        }
        if (userStatusEl) {
          userStatusEl.textContent = `✓ Signed in: ${user.email}`;
        }
        const btnText = document.getElementById("google-autofill-btn-text");
        if (btnText) btnText.textContent = "Google Details Filled";
      }

      onAuthStateChanged(auth, (user) => {
        if (user) populateFromUser(user);
      });

      if (autofillBtn) {
        autofillBtn.addEventListener("click", async () => {
          try {
            const res = await signInWithPopup(auth, googleProvider);
            populateFromUser(res.user);
          } catch (err) {
            console.warn("Google sign-in popup notice:", err.message);
          }
        });
      }

      const cart = WearhouseCart.get();
      const listEl = document.getElementById("summary-items-list");
      const totalEl = document.getElementById("summary-total");
      const payBtn = document.getElementById("pay-now-btn");
      const errorBanner = document.getElementById("error-banner");

      if (cart.length === 0) {
        listEl.innerHTML = `<p style="opacity: 0.6;">Your bag is empty.</p>`;
        payBtn.disabled = true;
        return;
      }

      listEl.innerHTML = cart.map(item => `
        <div class="summary-item">
          <div>
            <strong>${item.name}</strong><br>
            <span style="color: var(--color-cami-green); font-size: 12px;">Size: ${item.size} &times; ${item.qty}</span>
          </div>
          <div style="font-weight: 700;">
            ₹${((item.price_paise * item.qty) / 100).toLocaleString("en-IN")}
          </div>
        </div>
      `).join("");

      const totalPaise = WearhouseCart.totalPaise();
      totalEl.textContent = `₹${(totalPaise / 100).toLocaleString("en-IN")}`;

      // Form submission
      const form = document.getElementById("checkout-form");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorBanner.style.display = "none";
        payBtn.disabled = true;
        payBtn.innerHTML = `<span>Connecting to Razorpay...</span>`;

        const customer = {
          name: document.getElementById("cust-name").value.trim(),
          phone: document.getElementById("cust-phone").value.trim(),
          email: document.getElementById("cust-email").value.trim(),
          address: document.getElementById("cust-address").value.trim(),
          city: document.getElementById("cust-city").value.trim(),
          state: document.getElementById("cust-state").value.trim(),
          pincode: document.getElementById("cust-pincode").value.trim()
        };

        const payload = {
          items: cart.map(item => ({
            productId: item.productId,
            size: item.size,
            qty: item.qty
          })),
          customer: customer
        };

        try {
          // Call Cloud Function /api/checkout
          const res = await fetch("/api/checkout", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          const data = await res.json();
          if (!res.ok || !data.success) {
            throw new Error(data.error || "Unable to initiate checkout with Razorpay");
          }

          // Open Razorpay Standard Checkout
          const options = {
            key: data.keyId,
            amount: data.amount,
            currency: data.currency || "INR",
            name: "Wearhouse",
            description: "Core Line Basics Order",
            image: "/wearhouse-hero-with-hook.png",
            order_id: data.razorpayOrderId,
            handler: async function (response) {
              payBtn.innerHTML = `<span>Verifying payment...</span>`;

              try {
                // Verify signature on backend
                await fetch("/api/verify", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({
                    razorpay_order_id: response.razorpay_order_id,
                    razorpay_payment_id: response.razorpay_payment_id,
                    razorpay_signature: response.razorpay_signature,
                    order_id: data.orderId,
                    read_token: data.readToken
                  })
                });
              } catch (verifyErr) {
                console.warn("Signature verification note:", verifyErr);
              }

              // Clear cart and redirect to order success page
              WearhouseCart.clear();
              window.location.href = `/order?id=${data.orderId}&token=${data.readToken}`;
            },
            prefill: {
              name: customer.name,
              email: customer.email,
              contact: customer.phone
            },
            theme: {
              color: "#6b1030"
            },
            modal: {
              ondismiss: function () {
                payBtn.disabled = false;
                payBtn.innerHTML = `<span>Pay with Razorpay &rarr;</span>`;
              }
            }
          };

          const rzp = new Razorpay(options);
          rzp.open();
        } catch (err) {
          console.error("Checkout error:", err);
          errorBanner.textContent = err.message || "An error occurred while connecting to payment gateway.";
          errorBanner.style.display = "block";
          payBtn.disabled = false;
          payBtn.innerHTML = `<span>Pay with Razorpay &rarr;</span>`;
        }
      });
    });
  </script>
</body>
</html>
